<div class="shell" (keydown.escape)="menuOpen.set(false)">
  <app-sidebar id="mobile-sidebar" [class.open]="menuOpen()" (navigation)="menuOpen.set(false)" />
  @if (menuOpen()) {
  <button
    class="menu-backdrop"
    type="button"
    aria-label="Close menu"
    (click)="menuOpen.set(false)"
  ></button>
  }
  <main>
    <app-header [menuOpen]="menuOpen()" (menuToggle)="menuOpen.set(!menuOpen())" /><router-outlet />
  </main>
</div>
