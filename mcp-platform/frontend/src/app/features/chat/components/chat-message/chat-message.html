<article class="message" [class.user]="message.role === 'user'">
  <div class="avatar">{{ message.role === 'user' ? 'You' : 'AI' }}</div>
  <div class="body">
    <div class="text">
      <app-chat-markdown [content]="message.content || (busy ? 'Thinking?' : '')" />
    </div>
    @if (message.documents?.length) {
    <div class="rag">? Context: {{ message.documents!.join(', ') }}</div>
    }@for (call of message.tool_calls; track call.id) {
    <div brnCollapsible class="tool-card">
      <button brnButton brnCollapsibleTrigger type="button" class="tool-trigger">? {{ call.name }} <span>{{ call.content ? 'completed' : 'running' }}</span></button>
      <div brnCollapsibleContent class="tool-content">
        <strong>Arguments</strong>
        <pre>{{ call.arguments | json }}</pre>
        <strong>Result</strong>
        <pre>{{ call.content || 'Waiting?' }}</pre>
      </div>
    </div>
    }
  </div>
</article>
